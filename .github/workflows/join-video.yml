# 표지 동영상 조각 잇기 (홍보 사이트 관문 Media.js commitVideo_, 2026-11-26 WBS 22.19)
# 관문(Apps Script)은 요청 하나에 50MB까지만 보낼 수 있어, 큰 영상은 약 4MB 조각으로
# hero/_parts/{첨부ID}/000 · 001 … 에 커밋한다. 이 작업이 조각을 순서대로 이어 hero/{첨부ID}.mp4를 만들고 조각을 지운다.
name: Join video parts
on:
  push:
    branches: [main]
    paths: ['hero/_parts/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: join-video
  cancel-in-progress: false
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 실행할 때의 최신 main (앞선 실행이 이미 이은 것 위에서)
      - name: 조각 잇기
        run: |
          set -euo pipefail
          shopt -s nullglob
          changed=0
          for d in hero/_parts/*/; do
            id=$(basename "$d")
            if [[ ! "$id" =~ ^A-[0-9]{5,}$ ]]; then echo "건너뜀: $d"; continue; fi
            parts=("$d"[0-9][0-9][0-9])
            if [ ${#parts[@]} -eq 0 ]; then continue; fi
            cat "${parts[@]}" > "hero/$id.mp4"   # 글롭은 이름순 — 000, 001, … 순서
            head -c 8 "hero/$id.mp4" | tail -c 4 | grep -q ftyp || { echo "MP4가 아님: $id"; rm -f "hero/$id.mp4"; continue; }
            git rm -r -q "$d"
            git add "hero/$id.mp4"
            echo "이음: hero/$id.mp4 ($(stat -c %s "hero/$id.mp4") 바이트, 조각 ${#parts[@]}개)"
            changed=1
          done
          if [ "$changed" = 0 ]; then echo "이을 조각 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "[Media]: 표지 동영상 조각 잇기"
          git push
      - name: 사이트 다시 만들기 요청
        # 이 작업의 커밋으로 Pages가 다시 만들어지지 않을 때를 대비해 한 번 요청한다(실패해도 다음 커밋 때 반영됨)
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages 다시 만들기 요청 실패 — 무시"
        env:
          GH_TOKEN: ${{ github.token }}
